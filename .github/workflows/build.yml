name: Build Pyto IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Run Pyto Setup Script
        run: |
          chmod +x ./setup.sh
          ./setup.sh

      - name: Build Xcode Project
        run: |
          xcodebuild -workspace Pyto.xcworkspace \
                     -scheme Pyto \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     ARCHS=arm64 \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/Pyto.app Payload/
          zip -r Pyto.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pyto-Sideload-Package
          path: Pyto.ipa
