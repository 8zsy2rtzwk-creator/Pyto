name: Build Pyto IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Run Pyto Setup Script
        run: |
          chmod +x ./setup.sh
          ./setup.sh

      - name: Build Isolated Core Scheme
        run: |
          xcodebuild -workspace Pyto.xcworkspace \
                     -scheme "Pyto" \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -IDEBuildOperationMaxNumberOfConcurrentCompileTasks=4 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          # Szuka skompilowanej aplikacji w katalogu DerivedData programu Xcode
          CP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Pyto.app" -type d 2>/dev/null | grep -v "Intermediate" | head -n 1)
          
          # Jeśli tam nie ma, szuka w folderze projektu
          if [ -z "$CP_PATH" ]; then
            CP_PATH=$(find . -name "Pyto.app" -type d | grep -v "Intermediate" | head -n 1)
          fi
          
          if [ -z "$CP_PATH" ]; then
            echo "Error: Pyto.app not found w żadnej lokalizacji!" && exit 1
          fi
          
          echo "Znaleziono aplikację w: $CP_PATH"
          cp -r "$CP_PATH" Payload/
          zip -r Pyto.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pyto-Sideload-Package
          path: Pyto.ipa
