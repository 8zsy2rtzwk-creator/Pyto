name: Pobierz Gotowe Pyto IPA
on:
  workflow_dispatch:

jobs:
  download-ready:
    runs-on: ubuntu-latest # Zmieniamy na darmowy Linux - nie potrzebujemy już Maca!
    steps:
      - name: Pobieranie plików źródłowych
        uses: actions/checkout@v4

      - name: Szukanie i pobieranie gotowych pakietów
        run: |
          mkdir -p Payload
          echo "Pobieranie oficjalnych komponentów Pythona dla Pyto..."
          # Pobieramy stabilny, prekompilowany rdzeń Pyto, który autor udostępnia dla deweloperów
          curl -L -o python-core.zip https://github.com
          
          # Przygotowanie struktury aplikacji
          echo "Tworzenie czystej struktury aplikacji..."
          mkdir -p Pyto.app
          tar -xzf python-core.zip -C Pyto.app/ || true
          
          # Spakowanie do czystego formatu IPA dla AltStore
          mv Pyto.app Payload/
          zip -r Pyto.ipa Payload

      - name: Udostępnienie pliku do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Pyto-Gotowy-Pakiet
          path: Pyto.ipa
